name: Bug report
description: Report a problem with Margin Dictionary.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Zen 1.22b / Firefox 142
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.2.0
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: A public page URL, the word you selected, or screenshots. Do not include private browsing content.
